name: Backup to Docker Hub

on:
  schedule:
    - cron: "1 0 * * *"
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create archive
        run: |
          zip -r /tmp/repo-backup.zip . -x ".git/*"

      - name: Set image metadata
        run: |
          echo "IMAGE_NAME=$(echo \"${GITHUB_REPOSITORY##*/}\" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "TAG=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          cp /tmp/repo-backup.zip repo-backup.zip
          cat > Dockerfile <<'EOF'
          FROM alpine:3.20
          WORKDIR /backup
          COPY repo-backup.zip /backup/repo-backup.zip
          EOF
          docker build -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}-backup:${TAG} -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}-backup:latest .
          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}-backup:${TAG}
          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}-backup:latest
