name: CI Backend

on:
  push:
    paths:
      - "ADM_CalmWave/back-end/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/ADM_CalmWave/back-end
    defaults:
      run:
        working-directory: ADM_CalmWave/back-end
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ADM_CalmWave/back-end/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare .env
        run: cp .env.example .env

      - name: Tests (pytest)
        run: pytest
